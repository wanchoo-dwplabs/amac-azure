name: AMaC

trigger: none

schedules:
- cron: "0 */24 * * *"
  displayName: Every 24 hours
  branches:
    include:
    - main
  always: true

pool:
  name: 'AgentPool-Windows-Client'

parameters:
  - name: operationalMode
    displayName: Select operational mode
    type: string
    default: 'Publish'
    values:
    - 'Verify'
    - 'Package'
    - 'Publish'
  - name: archiveMode
    displayName: Archive published apps
    type: string
    default: 'No'
    values:
    - 'Yes'
    - 'No'

variables:
- group: AMaC
- group: AMaCKeyVault

# Stage: 1
# - Description: Test environment for required files
# - Input file required: None 
# - Output file created: None
stages:
- stage: initialise
  jobs:
  - job: initialise
    timeoutInMinutes: 5
    steps:
    - task: PowerShell@2
      name: write_variables
      displayName: Write-Variable
      inputs:
        filePath: 'Scripts/Write-Variable.ps1'
    - task: PowerShell@2
      name: check_template_files
      displayName: Test-TemplatesFolder
      inputs:
        filePath: 'Scripts/Test-TemplatesFolder.ps1'
# Stage: 2
# - Description: Install all required modules and remove files from previous pipeline executions
# - Input file required: None 
# - Output file created: None
- stage: prepare
  dependsOn:
  - initialise
  condition: and(succeeded(), eq(dependencies.initialise.outputs['initialise.check_template_files.shouldrun'], 'true'))
  jobs: 
  - job: prepare
    timeoutInMinutes: 15
    steps: 
    - task: PowerShell@2
      name: install_modules
      displayName: Install-Modules
      inputs:
        filePath: 'Scripts/Install-Modules.ps1'
    - task: PowerShell@2
      name: cleanup_folders
      displayName: Remove-Files
      inputs:
        filePath: 'Scripts/Remove-Files.ps1'
# Stage: 3
# - Description: Check that all onboarded apps are properly configured, have the required files necessary for the pipeline to successfully publish the app in Intune
# - Input file required: None
# - Output file created: AppsProcessList.json
- stage: validate
  dependsOn:
  - initialise
  - prepare
  condition: and(succeeded(), or(eq('${{ parameters.operationalMode }}', 'Verify'), eq('${{ parameters.operationalMode }}', 'Package'), eq('${{ parameters.operationalMode }}', 'Publish')))
  jobs:
  - job: validate
    timeoutInMinutes: 15
    steps:
    - task: PowerShell@2
      name: test_app_files
      displayName: Test-AppFiles
      inputs:
        filePath: 'Scripts/Test-AppFiles.ps1'
        arguments: -ConnectionString $(AMaC-StorageAccount-Key)
    - task: PublishBuildArtifacts@1
      name: publish_artifacts
      inputs:
        pathToPublish: $(Build.BinariesDirectory)
        artifactName: AppsProcessList
    - task: DeleteFiles@1
      name: cleanup_artifacts
      inputs:
        SourceFolder: '$(Build.BinariesDirectory)'
        Contents: '**'
# Stage: 4
# - Description: Check for new apps eligible to be processed by pipeline
# - Input file required: AppsProcessList.json 
# - Output file created: AppsDownloadList.json
- stage: compare
  dependsOn:
  - initialise
  - prepare
  - validate
  condition: and(succeeded(), eq(dependencies.validate.outputs['validate.test_app_files.shouldrun'], 'true'), or(eq('${{ parameters.operationalMode }}', 'Package'), eq('${{ parameters.operationalMode }}', 'Publish')))
  jobs:
  - job: compare
    timeoutInMinutes: 30
    steps:
    - task: DownloadBuildArtifacts@0
      name: download_artifacts
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: AppsProcessList
        downloadPath: '$(Build.ArtifactStagingDirectory)'
    - task: PowerShell@2
      name: test_app_list
      displayName: Test-AppList
      inputs:
        filePath: 'Scripts/Test-AppList.ps1'
        arguments: -TenantID $(TenantID) -ClientID $(ClientID) -ClientSecret $(AMaC-IntuneService-Key) -StorageAccountAccessKey $(AMaC-StorageAccount-Key)
        #arguments: -TenantID $(TenantID) -ClientID $(ClientID) -ClientSecret f478Q~GsrdU-Bm4SZ5IyOJQj6ddOKy_EAUtfLcUX -StorageAccountAccessKey $(SA-IntuneAppFactory-AccessKey)
    - task: PublishBuildArtifacts@1
      name: publish_artifacts
      inputs:
        pathToPublish: $(Build.BinariesDirectory)
        artifactName: AppsDownloadList
    - task: DeleteFiles@1
      name: cleanup_artifacts
      inputs:
        SourceFolder: '$(Build.BinariesDirectory)'
        Contents: '**'
# Stage: 5
# - Description: Download new apps eligible to be processed by pipeline
# - Input file required: AppsDownloadList.json 
# - Output file created: AppsPrepareList.json
- stage: download
  dependsOn:
  - initialise
  - prepare
  - validate
  - compare
  condition: and(succeeded(), eq(dependencies.compare.outputs['compare.test_app_list.shouldrun'], 'true'), or(eq('${{ parameters.operationalMode }}', 'Package'), eq('${{ parameters.operationalMode }}', 'Publish')))
  jobs:
  - job: download
    timeoutInMinutes: 120
    steps:
    - task: DownloadBuildArtifacts@0
      name: download_artifacts
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: AppsDownloadList
        downloadPath: '$(Build.ArtifactStagingDirectory)'    
    - task: PowerShell@2
      name: save_installer
      displayName: Save-Installer
      inputs:
        filePath: 'Scripts/Save-Installer.ps1'
        arguments: -StorageAccountAccessKey $(AMaC-StorageAccount-Key)
    - task: PublishBuildArtifacts@1
      name: publish_artifacts
      inputs:
        pathToPublish: $(Build.BinariesDirectory)
        artifactName: AppsPrepareList
    - task: DeleteFiles@1
      name: cleanup_artifacts
      inputs:
        SourceFolder: '$(Build.BinariesDirectory)'
        Contents: '**'
# Stage: 6
# - Description: Prepare apps by creating packaging folder, copy framework and setup files
# - Input file required: AppsPrepareList.json 
# - Output file created: AppsPublishList.json
- stage: build
  dependsOn:
  - initialise
  - prepare
  - validate
  - compare
  - download
  condition: and(succeeded(), eq(dependencies.download.outputs['download.save_installer.shouldrun'], 'true'), or(eq('${{ parameters.operationalMode }}', 'Package'), eq('${{ parameters.operationalMode }}', 'Publish')))
  jobs:
  - job: build_package_folder
    timeoutInMinutes: 60
    steps:
    - task: DownloadBuildArtifacts@0
      name: download_artifacts
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: AppsPrepareList
        downloadPath: '$(Build.ArtifactStagingDirectory)'
    - task: PowerShell@2
      name: create_package_folder
      displayName: Prepare-AppPackageFolder
      inputs:
        filePath: 'Scripts/Prepare-AppPackageFolder.ps1'
    - task: PublishBuildArtifacts@1
      name: publish_artifacts
      inputs:
        pathToPublish: $(Build.BinariesDirectory)
        artifactName: AppsPublishList
    - task: DeleteFiles@1
      name: cleanup_artifacts
      inputs:
        SourceFolder: '$(Build.BinariesDirectory)'
        Contents: '**'
# Stage: 7
# Description: Upload all apps that will be published to Intune to storage account for archival process
# - Input file required: AppsPublishList.json 
# - Output file created: None
- stage: archive
  dependsOn:
  - initialise
  - prepare
  - validate
  - compare
  - download
  - build
  condition: and(succeeded(), eq(dependencies.build.outputs['build_package_folder.create_package_folder.shouldrun'], 'true'), eq('${{ parameters.archiveMode }}', 'Yes'), or(eq('${{ parameters.operationalMode }}', 'Package'), eq('${{ parameters.operationalMode }}', 'Publish')))
  jobs:
  - job: archive
    timeoutInMinutes: 60
    steps:
    - task: DownloadBuildArtifacts@0
      name: download_artifacts
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: AppsPublishList
        downloadPath: '$(Build.ArtifactStagingDirectory)'
    - task: PowerShell@2
      name: upload_app_archive
      displayName: New-AppArchive
      inputs:
        filePath: 'Scripts/New-AppArchive.ps1'
        arguments: -StorageAccountName $(ArchiveStorageAccountName) -ContainerName $(ArchiveContainerName) -StorageAccountKey $(AMaC-StorageAccount-Key)
    - task: DeleteFiles@1
      name: cleanup_artifacts
      inputs:
        SourceFolder: '$(Build.BinariesDirectory)'
        Contents: '**'
# Stage: 8
# - Description: Invoke IntuneWin32AppPackager framework script to package and publish new apps to Intune
# - Input file required: AppsPublishList.json 
# - Output file created: AppsAssignList.json
- stage: publish
  dependsOn:
  - initialise
  - prepare
  - validate
  - compare
  - download
  - build
  condition: and(succeeded(), eq(dependencies.build.outputs['build_package_folder.create_package_folder.shouldrun'], 'true'), eq('${{ parameters.operationalMode }}', 'Publish'))
  jobs:
  - job: publish
    timeoutInMinutes: 120
    steps:
    - task: DownloadBuildArtifacts@0
      name: download_artifacts
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: AppsPublishList
        downloadPath: '$(Build.ArtifactStagingDirectory)'
    - task: PowerShell@2
      name: new_app
      displayName: New-Win32App
      inputs:
        filePath: 'Scripts/New-Win32App.ps1'
        arguments: -TenantID $(TenantID) -ClientID $(ClientID) -ClientSecret $(AMaC-IntuneService-Key) -WorkspaceID $(ReportWorkspaceID) -SharedKey $(AMaC-LogAnalyticsWkS-Key)
    - task: PublishBuildArtifacts@1
      name: publish_artifacts
      inputs:
        pathToPublish: $(Build.BinariesDirectory)
        artifactName: AppsPublishedList
    - task: DeleteFiles@1
      name: cleanup_artifacts
      inputs:
        SourceFolder: '$(Build.BinariesDirectory)'
        Contents: '**'
# Stage: 9
# - Description: Configure assignments for all applications that were published to Intune
# - Input file required: AppsAssignList.json (included in AppsPublishedList artifact)
# - Output file created: None
- stage: assign
  dependsOn:
  - initialise
  - prepare
  - validate
  - compare
  - download
  - build
  - publish
  condition: and(succeeded(), eq(dependencies.publish.outputs['publish.new_app.shouldrun'], 'true'), eq('${{ parameters.operationalMode }}', 'Publish'))
  jobs:
  - job: assign
    timeoutInMinutes: 120
    steps:
    - task: DownloadBuildArtifacts@0
      name: download_assign_artifacts
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: AppsPublishedList
        downloadPath: '$(Build.ArtifactStagingDirectory)'     
    - task: PowerShell@2
      name: assign_app
      displayName: New-AppAssignment
      inputs:
        filePath: 'Scripts/New-AppAssignment.ps1'
        arguments: -TenantID $(TenantID) -ClientID $(ClientID) -ClientSecret $(AMaC-IntuneService-Key)
    - task: DeleteFiles@1
      name: cleanup_artifacts
      inputs:
        SourceFolder: '$(Build.BinariesDirectory)'
        Contents: '**'
